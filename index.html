
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayank AI Chatbot</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: #080d1b;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.app {
  width: 100%;
  max-width: 950px;
  height: 90vh;
  min-height: 550px;
  background: #111a2e;
  border: 1px solid #263858;
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 50px #0077ff22;
}

header {
  padding: 18px 22px;
  background: #17233b;
  border-bottom: 1px solid #263858;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 45px;
  height: 45px;
  border-radius: 14px;
  background: linear-gradient(135deg,#00c6ff,#655cff);
  display: grid;
  place-items: center;
  font-size: 24px;
}

.logo h2 {
  font-size: 20px;
}

.logo p {
  font-size: 12px;
  color: #8fa6c9;
}

.status {
  color: #4ee6a0;
  font-size: 12px;
}

.status::before {
  content: "● ";
}

button {
  cursor: pointer;
  border: none;
}

.new-chat {
  padding: 10px 14px;
  background: #263c60;
  color: white;
  border-radius: 10px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.welcome {
  text-align: center;
  margin: auto;
  max-width: 500px;
  animation: appear .7s ease;
}

.robot {
  font-size: 65px;
  margin-bottom: 15px;
}

.welcome h1 {
  font-size: 30px;
  background: linear-gradient(90deg,#00d4ff,#a78bfa);
  color: transparent;
  background-clip: text;
}

.welcome p {
  color: #91a5c5;
  margin-top: 12px;
  line-height: 1.6;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 25px;
}

.suggestions button {
  background: #1d2c48;
  color: #c7d7f2;
  border: 1px solid #34496b;
  border-radius: 20px;
  padding: 10px 14px;
}

.suggestions button:hover {
  background: #29466f;
}

.message {
  max-width: 85%;
  padding: 14px 17px;
  border-radius: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  animation: appear .3s ease;
}

.user {
  align-self: flex-end;
  background: linear-gradient(135deg,#1268d9,#6556dc);
  border-bottom-right-radius: 4px;
}

.bot {
  align-self: flex-start;
  background: #1b2a43;
  border: 1px solid #2c405f;
  border-bottom-left-radius: 4px;
}

.message-label {
  font-size: 11px;
  color: #9fb8db;
  margin-bottom: 6px;
}

.copy {
  background: transparent;
  color: #91b9ef;
  font-size: 12px;
  margin-top: 9px;
}

.typing {
  color: #7fa8df;
  padding: 10px;
  animation: pulse 1s infinite;
}

footer {
  padding: 18px;
  background: #111a2e;
  border-top: 1px solid #263858;
}

.input-area {
  display: flex;
  gap: 10px;
  background: #1b2942;
  padding: 9px;
  border: 1px solid #34496b;
  border-radius: 15px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  padding: 10px;
  font-size: 15px;
}

.send {
  background: linear-gradient(135deg,#008cff,#735cff);
  color: white;
  padding: 12px 20px;
  border-radius: 11px;
  font-size: 15px;
}

.send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.footer-text {
  text-align: center;
  font-size: 11px;
  color: #7085a6;
  margin-top: 12px;
}

@keyframes appear {
  from {opacity:0;transform:translateY(12px)}
  to {opacity:1;transform:translateY(0)}
}

@keyframes pulse {
  50% {opacity:.4}
}

@media(max-width:600px) {
  .app {height:95vh;min-height:0}
  header {padding:13px}
  .logo h2 {font-size:17px}
  #chat {padding:15px}
  .message {max-width:95%}
  .welcome h1 {font-size:25px}
  .new-chat {padding:9px;font-size:12px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <div>
      <h2>Mayank AI</h2>
      <p>Your Smart AI Assistant</p>
    </div>
  </div>
  <div>
    <span class="status">AI Assistant</span>
    <button class="new-chat" onclick="newChat()">＋ New Chat</button>
  </div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <div class="robot">🤖</div>
    <h1>Hello, I'm Mayank AI</h1>
    <p>Your personal AI assistant. Ask me anything and let's explore the world of AI together!</p>

    <div class="suggestions">
      <button onclick="suggest('Tell me about yourself')">🤖 About AI</button>
      <button onclick="suggest('Explain HTML in simple words')">💻 Learn Coding</button>
      <button onclick="suggest('Tell me an interesting science fact')">🔬 Science</button>
      <button onclick="suggest('Give me a cricket quiz')">🏏 Cricket Quiz</button>
    </div>
  </div>
</main>

<footer>
  <div class="input-area">
    <input id="prompt" placeholder="Message Mayank AI..." autocomplete="off">
    <button class="send" id="sendBtn" onclick="sendMessage()">➤ Send</button>
  </div>
  <p class="footer-text">Mayank AI • Powered by Groq • AI can make mistakes</p>
</footer>

</div>

<script>
const API_KEY = "YOUR_GROQ_API_KEY";
const MODEL = "llama-3.3-70b-versatile";

const chat = document.getElementById("chat");
const input = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

let history = [];
let busy = false;

function suggest(text) {
  input.value = text;
  sendMessage();
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = type === "user" ? "You" : "Mayank AI";

  const content = document.createElement("div");
  content.textContent = text;

  div.appendChild(label);
  div.appendChild(content);

  if(type === "bot") {
    const copy = document.createElement("button");
    copy.className = "copy";
    copy.textContent = "📋 Copy";
    copy.onclick = () => {
      navigator.clipboard.writeText(text);
      copy.textContent = "✓ Copied";
    };
    div.appendChild(copy);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return content;
}

async function sendMessage() {
  const text = input.value.trim();

  if(!text || busy) return;

  if(!API_KEY || API_KEY === "YOUR_GROQ_API_KEY") {
    alert("Please add your Groq API key in the code first!");
    return;
  }

  const welcome = document.getElementById("welcome");
  if(welcome) welcome.remove();

  busy = true;
  sendBtn.disabled = true;
  input.value = "";

  addMessage(text, "user");

  history.push({
    role: "user",
    content: text
  });

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "Mayank AI is thinking...";
  chat.appendChild(typing);

  try {
    const response = await fetch(
      "https://api.groq.com/openai/v1/chat/completions",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
          model: MODEL,
          messages: [
            {
              role: "system",
              content: "You are Mayank AI, a helpful, friendly AI assistant. Give clear and useful answers."
            },
            ...history
          ],
          temperature: 0.7,
          max_tokens: 1500
        })
      }
    );

    const data = await response.json();

    if(!response.ok) {
      throw new Error(data.error?.message || "Groq API error");
    }

    const answer = data.choices?.[0]?.message?.content;

    if(!answer) throw new Error("Empty response from AI");

    typing.remove();

    history.push({
      role: "assistant",
      content: answer
    });

    addMessage(answer, "bot");

  } catch(error) {
    typing.remove();

    history.pop();

    addMessage("Error: " + error.message, "bot");

  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

function newChat() {
  if(busy) return;

  history = [];
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="robot">🤖</div>
      <h1>Hello, I'm Mayank AI</h1>
      <p>Your personal AI assistant. Ask me anything!</p>
      <div class="suggestions">
        <button onclick="suggest('Explain HTML')">💻 Coding</button>
        <button onclick="suggest('Tell me a science fact')">🔬 Science</button>
        <button onclick="suggest('Give me a cricket quiz')">🏏 Cricket</button>
      </div>
    </div>
  `;
}

input.addEventListener("keydown", function(e) {
  if(e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
